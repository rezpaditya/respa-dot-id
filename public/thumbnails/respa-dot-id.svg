<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#111111"/>
  <!-- Grid lines -->
  <line x1="0" y1="100" x2="800" y2="100" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="0" y1="200" x2="800" y2="200" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="160" y1="0" x2="160" y2="500" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="320" y1="0" x2="320" y2="500" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="480" y1="0" x2="480" y2="500" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="640" y1="0" x2="640" y2="500" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Code brackets -->
  <text x="230" y="290" font-family="monospace" font-size="120" font-weight="bold" fill="#14b8a6" opacity="0.9">&lt;/&gt;</text>
  <!-- Camera shutter rings -->
  <circle cx="590" cy="250" r="80" fill="none" stroke="#14b8a6" stroke-width="3" opacity="0.4"/>
  <circle cx="590" cy="250" r="55" fill="none" stroke="#14b8a6" stroke-width="2" opacity="0.6"/>
  <circle cx="590" cy="250" r="30" fill="#14b8a6" opacity="0.25"/>
  <!-- Shutter blades -->
  <line x1="590" y1="170" x2="590" y2="195" stroke="#14b8a6" stroke-width="3" opacity="0.7"/>
  <line x1="590" y1="305" x2="590" y2="330" stroke="#14b8a6" stroke-width="3" opacity="0.7"/>
  <line x1="510" y1="250" x2="535" y2="250" stroke="#14b8a6" stroke-width="3" opacity="0.7"/>
  <line x1="645" y1="250" x2="670" y2="250" stroke="#14b8a6" stroke-width="3" opacity="0.7"/>
  <!-- Accent dot -->
  <circle cx="400" cy="440" r="4" fill="#14b8a6" opacity="0.5"/>
</svg>
