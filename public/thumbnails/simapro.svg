<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#111111"/>
  <!-- Map background grid -->
  <line x1="160" y1="100" x2="640" y2="100" stroke="#0d2018" stroke-width="1"/>
  <line x1="160" y1="160" x2="640" y2="160" stroke="#0d2018" stroke-width="1"/>
  <line x1="160" y1="220" x2="640" y2="220" stroke="#0d2018" stroke-width="1"/>
  <line x1="160" y1="280" x2="640" y2="280" stroke="#0d2018" stroke-width="1"/>
  <line x1="160" y1="340" x2="640" y2="340" stroke="#0d2018" stroke-width="1"/>
  <line x1="160" y1="400" x2="640" y2="400" stroke="#0d2018" stroke-width="1"/>
  <line x1="160" y1="100" x2="160" y2="400" stroke="#0d2018" stroke-width="1"/>
  <line x1="240" y1="100" x2="240" y2="400" stroke="#0d2018" stroke-width="1"/>
  <line x1="320" y1="100" x2="320" y2="400" stroke="#0d2018" stroke-width="1"/>
  <line x1="400" y1="100" x2="400" y2="400" stroke="#0d2018" stroke-width="1"/>
  <line x1="480" y1="100" x2="480" y2="400" stroke="#0d2018" stroke-width="1"/>
  <line x1="560" y1="100" x2="560" y2="400" stroke="#0d2018" stroke-width="1"/>
  <line x1="640" y1="100" x2="640" y2="400" stroke="#0d2018" stroke-width="1"/>
  <!-- Asset location dots -->
  <circle cx="240" cy="200" r="8" fill="#10b981" opacity="0.5"/>
  <circle cx="350" cy="300" r="8" fill="#10b981" opacity="0.5"/>
  <circle cx="500" cy="180" r="8" fill="#10b981" opacity="0.5"/>
  <circle cx="420" cy="360" r="8" fill="#10b981" opacity="0.5"/>
  <circle cx="190" cy="340" r="8" fill="#10b981" opacity="0.4"/>
  <circle cx="580" cy="310" r="8" fill="#10b981" opacity="0.4"/>
  <!-- Connection lines -->
  <line x1="240" y1="200" x2="350" y2="300" stroke="#10b981" stroke-width="1" opacity="0.3"/>
  <line x1="350" y1="300" x2="420" y2="360" stroke="#10b981" stroke-width="1" opacity="0.3"/>
  <line x1="500" y1="180" x2="580" y2="310" stroke="#10b981" stroke-width="1" opacity="0.3"/>
  <!-- Main pin (primary asset) -->
  <circle cx="400" cy="230" r="28" fill="#10b981" opacity="0.2" stroke="#10b981" stroke-width="1" />
  <circle cx="400" cy="230" r="18" fill="#10b981" opacity="0.3"/>
  <!-- Pin shape -->
  <path d="M400 155 C375 155 355 175 355 200 C355 230 400 275 400 275 C400 275 445 230 445 200 C445 175 425 155 400 155 Z" fill="#10b981" opacity="0.9"/>
  <circle cx="400" cy="200" r="14" fill="#111111" opacity="0.7"/>
  <!-- Pulse rings around main pin -->
  <circle cx="400" cy="215" r="42" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>
  <circle cx="400" cy="215" r="62" fill="none" stroke="#10b981" stroke-width="1" opacity="0.15"/>
</svg>
