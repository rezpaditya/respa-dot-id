<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#111111"/>
  <!-- Phone outline -->
  <rect x="300" y="80" width="200" height="340" rx="24" fill="#1a120a" stroke="#f97316" stroke-width="2.5"/>
  <rect x="315" y="100" width="170" height="240" rx="4" fill="#111111"/>
  <!-- Home indicator -->
  <rect x="360" y="390" width="80" height="6" rx="3" fill="#f97316" opacity="0.5"/>
  <!-- Card on screen -->
  <rect x="325" y="115" width="150" height="85" rx="8" fill="#f97316" opacity="0.85"/>
  <circle cx="345" cy="133" r="12" fill="#111111" opacity="0.3"/>
  <rect x="325" y="172" width="90" height="8" rx="2" fill="#111111" opacity="0.3"/>
  <rect x="325" y="186" width="60" height="6" rx="2" fill="#111111" opacity="0.2"/>
  <!-- Amount on screen -->
  <rect x="330" y="218" width="140" height="30" rx="4" fill="#1a1a1a"/>
  <rect x="340" y="225" width="60" height="16" rx="2" fill="#f97316" opacity="0.4"/>
  <!-- Pay button -->
  <rect x="330" y="260" width="140" height="36" rx="18" fill="#f97316"/>
  <!-- Payment ripple waves emanating from phone -->
  <path d="M 530 250 Q 555 220 530 190" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M 548 265 Q 585 225 548 185" fill="none" stroke="#f97316" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <path d="M 566 280 Q 615 230 566 180" fill="none" stroke="#f97316" stroke-width="1.5" stroke-linecap="round" opacity="0.3"/>
  <!-- Checkmark in circle -->
  <circle cx="620" cy="235" r="22" fill="none" stroke="#f97316" stroke-width="2" opacity="0.7"/>
  <polyline points="610,235 618,243 632,227" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
</svg>
