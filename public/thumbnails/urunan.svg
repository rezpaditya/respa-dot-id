<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#111111"/>
  <!-- Receipt shape -->
  <rect x="280" y="100" width="240" height="300" rx="6" fill="#1c1c2e" stroke="#6366f1" stroke-width="2"/>
  <!-- Receipt lines -->
  <line x1="304" y1="150" x2="496" y2="150" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <line x1="304" y1="180" x2="496" y2="180" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <line x1="304" y1="210" x2="496" y2="210" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <line x1="304" y1="240" x2="496" y2="240" stroke="#6366f1" stroke-width="1.5" opacity="0.4"/>
  <!-- Amount blocks -->
  <rect x="304" y="158" width="80" height="14" rx="2" fill="#6366f1" opacity="0.3"/>
  <rect x="412" y="158" width="60" height="14" rx="2" fill="#6366f1" opacity="0.5"/>
  <rect x="304" y="188" width="110" height="14" rx="2" fill="#6366f1" opacity="0.3"/>
  <rect x="412" y="188" width="60" height="14" rx="2" fill="#6366f1" opacity="0.5"/>
  <rect x="304" y="218" width="70" height="14" rx="2" fill="#6366f1" opacity="0.3"/>
  <rect x="412" y="218" width="60" height="14" rx="2" fill="#6366f1" opacity="0.5"/>
  <!-- Split divider line with scissors icon -->
  <line x1="280" y1="275" x2="520" y2="275" stroke="#6366f1" stroke-width="2.5" stroke-dasharray="8 5"/>
  <!-- Split arrows -->
  <polyline points="340,295 310,310 340,325" fill="none" stroke="#6366f1" stroke-width="2" stroke-linejoin="round"/>
  <line x1="310" y1="310" x2="400" y2="310" stroke="#6366f1" stroke-width="2"/>
  <polyline points="460,295 490,310 460,325" fill="none" stroke="#6366f1" stroke-width="2" stroke-linejoin="round"/>
  <line x1="490" y1="310" x2="400" y2="310" stroke="#6366f1" stroke-width="2"/>
  <!-- Person icons -->
  <circle cx="200" cy="220" r="28" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
  <circle cx="200" cy="207" r="10" fill="#6366f1" opacity="0.5"/>
  <path d="M175 240 Q200 225 225 240" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.5"/>
  <circle cx="600" cy="220" r="28" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.6"/>
  <circle cx="600" cy="207" r="10" fill="#6366f1" opacity="0.5"/>
  <path d="M575 240 Q600 225 625 240" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.5"/>
</svg>
